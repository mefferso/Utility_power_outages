name: Archive Entergy direct outage incidents
on:
  workflow_dispatch:
  schedule:
    - cron: '27 * * * *'
permissions:
  contents: write
concurrency:
  group: utility-archive
  cancel-in-progress: false
jobs:
  enter:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect public Entergy incidents
        run: python scripts/entergy.py
      - name: Commit observations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/entergy/
          if ! git diff --cached --quiet; then
            git commit -m "Archive Entergy public outage observations"
            git push
          fi
